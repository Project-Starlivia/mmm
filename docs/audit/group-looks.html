<meta charset="utf-8">
<style>
  :root {
    --bg: #15171c; --panel: #1b1e24; --ink: #dde2e9; --ink-dim: #828a96;
    --line: #2a2f38; --accent: #5932ff;
    --node-bg: #232830; --node-border: #3b424d; --node-border-strong: #5d6673;
    --edge: #4d5563;
    --font: "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f4f6; --panel: #fff; --ink: #1f2328; --ink-dim: #6b7280;
      --line: #e2e5ea; --node-bg: #fff; --node-border: #cfd5dd;
      --node-border-strong: #9aa4b1; --edge: #b6bec9;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  .lead { color: var(--ink-dim); font-size: 13px; line-height: 1.75; margin: 0 0 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 16px; overflow: hidden; }
  .head { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .name { font-size: 14px; font-weight: 600; }
  .tag { font-size: 11px; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; }
  .tag.strong { color: #4ea1ff; }
  .tag.mid { color: #c9a227; }
  .tag.weak { color: var(--ink-dim); }
  .body { overflow-x: auto; }
  svg { display: block; background: var(--bg); }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.7; stroke-linecap: round; }
  .box { fill: var(--node-bg); stroke: var(--node-border); stroke-width: 1.2; }
  .box.root { stroke: var(--node-border-strong); stroke-width: 2; }
  .lbl { font-family: var(--font); font-size: 13px; fill: var(--ink); dominant-baseline: central; }
  .note { font-size: 12px; color: var(--ink-dim); line-height: 1.75; padding: 0 14px 12px; }
  b { color: var(--ink); font-weight: 600; }
</style>

<div class="wrap">
  <h1>束のまとまりを、どう見せるか</h1>
  <p class="lead">
    同じ文書に別々の表現を当てたもの。右に 2 束・左に 1 束:<br>
    <b>記法 / レイアウト</b> → <code>---</code> → <b>コア / UI / テスト</b> → <code>---</code> → <b>保存 / 書き出し</b><br>
    タグは「<span class="tag strong">束の大きさで効く</span>／<span class="tag mid">境目だけ</span>／<span class="tag weak">弱い</span>」。
    前回失敗したのは、束が 100〜200px を占めるのに 30px の帯の中で表現しようとしたためなので、
    <b>信号が束の大きさで出ているか</b>を物差しにしています。
  </p>
  <div id="out"></div>
</div>

<script>
// ---- サンプル（実際のアプリの座標） ----
const ROOT = { x: -24.5, y: -15, w: 49, h: 30, label: "root", root: true };
const KIDS = [
  { x: 69.5,  y: -88, w: 50, h: 30, label: "記法",       b: 0, dir: 1 },
  { x: 69.5,  y: -48, w: 89, h: 30, label: "レイアウト",  b: 0, dir: 1 },
  { x: -119.5, y: -55, w: 50, h: 30, label: "コア",       b: 1, dir: -1 },
  { x: -106.5, y: -15, w: 37, h: 30, label: "UI",         b: 1, dir: -1 },
  { x: -132.5, y: 25,  w: 63, h: 30, label: "テスト",     b: 1, dir: -1 },
  { x: 69.5,  y: 18,  w: 50, h: 30, label: "保存",        b: 2, dir: 1 },
  { x: 69.5,  y: 58,  w: 76, h: 30, label: "書き出し",    b: 2, dir: 1 },
];
const GRAND = [
  { x: 164.5, y: -88, w: 63, h: 30, label: "見出し", p: "記法" },
  { x: 203.5, y: -48, w: 50, h: 30, label: "左右",   p: "レイアウト" },
  { x: -227.5, y: -55, w: 63, h: 30, label: "パーサ", p: "コア" },
];
const BCOLOR = ["#5b9bd5", "#c98a3c", "#7aa86b"]; // 束ごとの色（案 E / I 用）

const cy = (n) => n.y + n.h / 2;
const H1U = 0.08, H1V = 0.27, H2U = 0.58, H2V = 0.05; // 既定の曲線

/** 親の縁から子の縁へ、いまの既定の曲線 */
function curve(px, py, cx2, cy2, dir) {
  const du = (cx2 - px) * dir, dv = cy2 - py;
  const at = (u, v) => `${(px + dir * u).toFixed(2)} ${(py + v).toFixed(2)}`;
  return `M ${at(0, 0)} C ${at(du * H1U, dv * H1V)}, ${at(du - du * H2U, dv - dv * H2V)}, ${at(du, dv)}`;
}

/** 付け根の帯（親の高さの 0.6 倍に、その側の子を等間隔で） */
function fan(kids, side) {
  const list = kids.filter((k) => k.dir === side).sort((a, b) => cy(a) - cy(b));
  const band = ROOT.h * 0.6, m = new Map();
  list.forEach((k, i) => m.set(k.label, ((i + 0.5) / list.length - 0.5) * band));
  return m;
}
const FAN = new Map([...fan(KIDS, 1), ...fan(KIDS, -1)]);

const rootEdge = (dir) => (dir === 1 ? ROOT.x + ROOT.w : ROOT.x);
const kidEdge = (k) => (k.dir === 1 ? k.x : k.x + k.w);

/** 既定のエッジ一式（root→子、子→孫） */
function baseEdges(kids, shift = () => 0, cls = () => "edge", style = () => "") {
  const out = [];
  for (const k of kids) {
    const sy = cy(ROOT) + FAN.get(k.label);
    out.push(`<path class="${cls(k)}" ${style(k)} d="${curve(rootEdge(k.dir), sy, kidEdge(k), cy(k) + shift(k), k.dir)}"/>`);
  }
  for (const g of GRAND) {
    const p = kids.find((k) => k.label === g.p);
    const dir = p.dir;
    const px = dir === 1 ? p.x + p.w : p.x;
    out.push(`<path class="${cls(p)}" ${style(p)} d="${curve(px, cy(p) + shift(p), dir === 1 ? g.x : g.x + g.w, cy(g) + shift(p), dir)}"/>`);
  }
  return out.join("");
}

function boxes(kids, shift = () => 0, extra = () => "") {
  const one = (n, dy, ex) => `
    <g transform="translate(${n.x} ${n.y + dy})">
      <rect class="box${n.root ? " root" : ""}" width="${n.w}" height="${n.h}" rx="8" ${ex}/>
      <text class="lbl" x="12" y="${n.h / 2}">${n.label}</text>
    </g>`;
  return one(ROOT, 0, "") +
    kids.map((k) => one(k, shift(k), extra(k))).join("") +
    GRAND.map((g) => {
      const p = kids.find((k) => k.label === g.p);
      return one(g, shift(p), extra(p));
    }).join("");
}

/** 束ごとの縦の広がり（幹や囲みの高さに使う） */
function extent(kids, b, shift = () => 0) {
  const list = kids.filter((k) => k.b === b);
  const all = [...list, ...GRAND.filter((g) => list.some((k) => k.label === g.p))];
  let y0 = Infinity, y1 = -Infinity, x0 = Infinity, x1 = -Infinity;
  for (const n of all) {
    const p = kids.find((k) => k.label === (n.p ?? n.label)) ?? n;
    const dy = shift(p);
    y0 = Math.min(y0, n.y + dy); y1 = Math.max(y1, n.y + n.h + dy);
    x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x + n.w);
  }
  return { y0, y1, x0, x1, dir: list[0].dir };
}

const BUNDLES = [0, 1, 2];

// ---- 案 ----
const VARIANTS = [
  {
    name: "A. 現状", tag: "weak", tagText: "弱い",
    note: "束の切れ目は 26px の余白だけ。どこで区切ったのか読み取れない。",
    draw: () => baseEdges(KIDS) + boxes(KIDS),
  },
  {
    name: "B. 束の間隔を広げる", tag: "strong", tagText: "束の大きさで効く",
    note: "余白を 26px → 70px に。<b>足すものがゼロ</b>で、木の絵を一切汚さない。単体だと「離れている」以上の意味は出ないが、他と併せると土台として効く。",
    draw: () => {
      const sh = (k) => (k.b === 0 ? -40 : k.b === 2 ? 40 : 0);
      return baseEdges(KIDS, sh) + boxes(KIDS, sh);
    },
  },
  {
    name: "C. 束の境目に区切り線", tag: "mid", tagText: "境目だけ",
    note: "テキストの <code>---</code> がそのまま画面にも出る素直さ。ただし<b>境目にしか情報が無い</b>ので、束の途中を見ているときは何も伝わらない。",
    draw: () => {
      // 同じ側で縦に隣り合う束の「隙間の中央」に引く
      let lines = "";
      for (const dir of [1, -1]) {
        const bs = BUNDLES.filter((b) => KIDS.some((k) => k.b === b && k.dir === dir))
          .map((b) => ({ b, ...extent(KIDS, b) }))
          .sort((a, c) => a.y0 - c.y0);
        for (let i = 1; i < bs.length; i++) {
          const y = (bs[i - 1].y1 + bs[i].y0) / 2;
          const x0 = rootEdge(dir) + dir * 26;
          const far = dir === 1 ? Math.max(bs[i - 1].x1, bs[i].x1) : Math.min(bs[i - 1].x0, bs[i].x0);
          lines += `<line x1="${x0}" y1="${y}" x2="${far}" y2="${y}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 5"/>`;
        }
      }
      return baseEdges(KIDS) + lines + boxes(KIDS);
    },
  },
  {
    name: "D. 束ごとに縦の幹を立てる", tag: "strong", tagText: "束の大きさで効く",
    note: "ルートから少し出たところに<b>束の高さぶんの幹</b>を立て、そこから子が生える。信号の長さが束の高さそのものになる。囲みではなく木のままなのも保てる。",
    draw: () => {
      let s = "";
      for (const b of BUNDLES) {
        const e = extent(KIDS, b);
        const list = KIDS.filter((k) => k.b === b);
        const tx = rootEdge(e.dir) + e.dir * 34;
        const my = (e.y0 + e.y1) / 2;
        const ty0 = Math.min(...list.map(cy)), ty1 = Math.max(...list.map(cy));
        s += `<path class="edge" d="M ${rootEdge(e.dir)} ${cy(ROOT) + (b === 0 ? -8 : b === 2 ? 8 : 0)} L ${tx} ${my}"/>`;
        s += `<path class="edge" d="M ${tx} ${ty0} L ${tx} ${ty1}"/>`;
        for (const k of list) s += `<path class="edge" d="M ${tx} ${cy(k)} L ${kidEdge(k)} ${cy(k)}"/>`;
      }
      for (const g of GRAND) {
        const p = KIDS.find((k) => k.label === g.p);
        const px = p.dir === 1 ? p.x + p.w : p.x;
        s += `<path class="edge" d="${curve(px, cy(p), p.dir === 1 ? g.x : g.x + g.w, cy(g), p.dir)}"/>`;
      }
      return s + boxes(KIDS);
    },
  },
  {
    name: "D2. 束ごとに中間点を置く（曲線のまま）", tag: "strong", tagText: "束の大きさで効く",
    note: "幹を直線で引く代わりに、束ごとに<b>中間点</b>を置いて、いまと同じ曲線で繋いだもの。線の文法は一切変わらない。ルートから中間点へ 1 本、中間点から各子へ 1 本ずつ。",
    draw: () => {
      let s = "";
      for (const b of BUNDLES) {
        const list = KIDS.filter((k) => k.b === b);
        const e = extent(KIDS, b);
        const dir = e.dir;
        const wx = rootEdge(dir) + dir * 40;
        const wy = list.reduce((a, k) => a + cy(k), 0) / list.length;
        const off = b === 0 ? -8 : b === 2 ? 8 : 0;
        s += `<path class="edge" d="${curve(rootEdge(dir), cy(ROOT) + off, wx, wy, dir)}"/>`;
        for (const k of list) s += `<path class="edge" d="${curve(wx, wy, kidEdge(k), cy(k), dir)}"/>`;
      }
      for (const g of GRAND) {
        const pn = KIDS.find((k) => k.label === g.p);
        const px = pn.dir === 1 ? pn.x + pn.w : pn.x;
        s += `<path class="edge" d="${curve(px, cy(pn), pn.dir === 1 ? g.x : g.x + g.w, cy(g), pn.dir)}"/>`;
      }
      return s + boxes(KIDS);
    },
  },
  {
    name: "D3. 中間点 ＋ 間隔", tag: "strong", tagText: "束の大きさで効く",
    note: "D2 に余白を足したもの。中間点どうしが離れるので、束が分かれていることがより読める。<b>足しているのは曲線と余白だけ</b>。",
    draw: () => {
      const sh = (k) => (k.b === 0 ? -40 : k.b === 2 ? 40 : 0);
      let s = "";
      for (const b of BUNDLES) {
        const list = KIDS.filter((k) => k.b === b);
        const dir = list[0].dir;
        const wx = rootEdge(dir) + dir * 40;
        const wy = list.reduce((a, k) => a + cy(k) + sh(k), 0) / list.length;
        const off = b === 0 ? -8 : b === 2 ? 8 : 0;
        s += `<path class="edge" d="${curve(rootEdge(dir), cy(ROOT) + off, wx, wy, dir)}"/>`;
        for (const k of list) s += `<path class="edge" d="${curve(wx, wy, kidEdge(k), cy(k) + sh(k), dir)}"/>`;
      }
      for (const g of GRAND) {
        const pn = KIDS.find((k) => k.label === g.p);
        const px = pn.dir === 1 ? pn.x + pn.w : pn.x;
        s += `<path class="edge" d="${curve(px, cy(pn) + sh(pn), pn.dir === 1 ? g.x : g.x + g.w, cy(g) + sh(pn), pn.dir)}"/>`;
      }
      return s + boxes(KIDS, sh);
    },
  },
  {
    name: "E. 束ごとに枝の色を変える", tag: "strong", tagText: "束の大きさで効く",
    note: "手描きのマインドマップの定番。<b>束の全域に信号が出る</b>のが強み。mmm は既にブランド色と選択色を持っているので、色の役割が 3 つに増えるのが引っかかる。",
    draw: () => baseEdges(KIDS, () => 0, () => "edge", (k) => `style="stroke:${BCOLOR[k.b]}"`) + boxes(KIDS),
  },
  {
    name: "F. 束ごとに枝の濃さを変える", tag: "mid", tagText: "境目だけ",
    note: "色を足さずに束を分ける案。隣り合う束の濃淡が交互になるだけなので、<b>束が 3 つ以上あると同じ濃さが再登場</b>して混ざる。",
    draw: () => baseEdges(KIDS, () => 0, () => "edge", (k) => `style="opacity:${k.b % 2 === 0 ? 1 : 0.45}"`) + boxes(KIDS),
  },
  {
    name: "G. 束ごとに淡い囲み", tag: "strong", tagText: "束の大きさで効く",
    note: "いちばん強く出るが、<b>木の絵の上に別レイヤーの図形が乗る</b>。今回そこが嫌だという話だったので比較用。ノードが増えると矩形が大きくなりすぎる問題もある。",
    draw: () => {
      let s = "";
      for (const b of BUNDLES) {
        const e = extent(KIDS, b);
        s += `<rect x="${e.x0 - 12}" y="${e.y0 - 10}" width="${e.x1 - e.x0 + 24}" height="${e.y1 - e.y0 + 20}" rx="12" fill="${BCOLOR[b]}" fill-opacity="0.07" stroke="${BCOLOR[b]}" stroke-opacity="0.35" stroke-width="1"/>`;
      }
      return s + baseEdges(KIDS) + boxes(KIDS);
    },
  },
  {
    name: "H. 束ごとに背景の帯", tag: "strong", tagText: "束の大きさで効く",
    note: "囲みの枠を取って、横方向の帯だけにしたもの。枠線が無いぶん図形感は薄いが、<b>やはり別レイヤー</b>。ノードの幅に依存しないので囲みより安定する。",
    draw: () => {
      let s = "";
      for (const b of BUNDLES) {
        const e = extent(KIDS, b);
        const x = e.dir === 1 ? rootEdge(1) + 20 : -300;
        s += `<rect x="${x}" y="${e.y0 - 9}" width="300" height="${e.y1 - e.y0 + 18}" fill="${BCOLOR[b]}" fill-opacity="0.06"/>`;
      }
      return s + baseEdges(KIDS) + boxes(KIDS);
    },
  },
  {
    name: "I. 束の分岐点に印を打つ", tag: "weak", tagText: "弱い",
    note: "束ごとに付け根をまとめて、そこに丸を置く。<b>前回失敗したのがこれ</b>。信号が親の辺（30px）の中にしか無いので、束の大きさには届かない。",
    draw: () => {
      let s = "";
      const pt = new Map();
      for (const b of BUNDLES) {
        const e = extent(KIDS, b);
        const off = b === 0 ? -8 : b === 2 ? 8 : 0;
        pt.set(b, { x: rootEdge(e.dir), y: cy(ROOT) + off });
      }
      for (const k of KIDS) {
        const p = pt.get(k.b);
        s += `<path class="edge" d="${curve(p.x, p.y, kidEdge(k), cy(k), k.dir)}"/>`;
      }
      for (const g of GRAND) {
        const p = KIDS.find((k) => k.label === g.p);
        const px = p.dir === 1 ? p.x + p.w : p.x;
        s += `<path class="edge" d="${curve(px, cy(p), p.dir === 1 ? g.x : g.x + g.w, cy(g), p.dir)}"/>`;
      }
      for (const b of BUNDLES) {
        const p = pt.get(b);
        s += `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--edge)"/>`;
      }
      return s + boxes(KIDS);
    },
  },
  {
    name: "J. 束の先頭ノードに印", tag: "mid", tagText: "境目だけ",
    note: "束の最初のノードの外側に短い縦線を置く。テキストの <code>---</code> の位置に対応していて分かりやすいが、<b>先頭にしか無い</b>ので束の広がりは伝わらない。",
    draw: () => {
      let s = baseEdges(KIDS);
      for (const b of BUNDLES) {
        const list = KIDS.filter((k) => k.b === b).sort((a, c) => cy(a) - cy(c));
        const k = list[0];
        const x = k.dir === 1 ? k.x - 9 : k.x + k.w + 9;
        s += `<line x1="${x}" y1="${k.y - 2}" x2="${x}" y2="${k.y + k.h + 2}" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>`;
      }
      return s + boxes(KIDS);
    },
  },
  {
    name: "K. 幹 ＋ 間隔（D + B）", tag: "strong", tagText: "束の大きさで効く",
    note: "幹だけだと隣の束と近すぎて幹が並んで見えるので、間隔を足したもの。<b>足しているのは木の一部と余白だけ</b>で、別レイヤーの図形はゼロ。",
    draw: () => {
      const sh = (k) => (k.b === 0 ? -40 : k.b === 2 ? 40 : 0);
      let s = "";
      for (const b of BUNDLES) {
        const e = extent(KIDS, b, sh);
        const list = KIDS.filter((k) => k.b === b);
        const tx = rootEdge(e.dir) + e.dir * 34;
        const my = (e.y0 + e.y1) / 2;
        const ys = list.map((k) => cy(k) + sh(k));
        s += `<path class="edge" d="M ${rootEdge(e.dir)} ${cy(ROOT) + (b === 0 ? -8 : b === 2 ? 8 : 0)} L ${tx} ${my}"/>`;
        s += `<path class="edge" d="M ${tx} ${Math.min(...ys)} L ${tx} ${Math.max(...ys)}"/>`;
        for (const k of list) s += `<path class="edge" d="M ${tx} ${cy(k) + sh(k)} L ${kidEdge(k)} ${cy(k) + sh(k)}"/>`;
      }
      for (const g of GRAND) {
        const p = KIDS.find((k) => k.label === g.p);
        const px = p.dir === 1 ? p.x + p.w : p.x;
        s += `<path class="edge" d="${curve(px, cy(p) + sh(p), p.dir === 1 ? g.x : g.x + g.w, cy(g) + sh(p), p.dir)}"/>`;
      }
      return s + boxes(KIDS, sh);
    },
  },
];

const PAD = 30;
function viewBox(shifted) {
  const dy = shifted ? 46 : 0;
  return [-300 - PAD, -130 - dy - PAD, 620 + PAD * 2, 250 + dy * 2 + PAD * 2].join(" ");
}

document.getElementById("out").innerHTML = VARIANTS.map((v) => {
  const shifted = /B\.|K\./.test(v.name);
  const vb = viewBox(shifted).split(" ");
  return `
  <div class="card">
    <div class="head">
      <span class="name">${v.name}</span>
      <span class="tag ${v.tag}">${v.tagText}</span>
    </div>
    <div class="body">
      <svg viewBox="${vb.join(" ")}" width="${vb[2]}" height="${vb[3]}">${v.draw()}</svg>
    </div>
    <div class="note">${v.note}</div>
  </div>`;
}).join("");
</script>
