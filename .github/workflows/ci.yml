# 押されたものを確かめ、main のものだけを配る。
#
# **1 つのファイルにまとめてある。** ワークフローをまたぐと順番を約束できず
# （`needs` は同じファイルの中だけ）、確かめ終わる前に配り始めてしまう。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチで重なったら古いほうは捨てる。走り終えた順に上書きされて、
# 新しいはずが古い中身になるのを避ける
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # MoonBit は公式の GitHub Action が無いので、配布スクリプトで入れる。
      # 置き場所は $HOME/.moon/bin で、PATH に通すのはこちらの仕事。
      #
      # **版を固定する。** 既定は「そのとき最新」なので、こちらが 1 行も
      # 書かない日に赤くなる（整形の出す形も非推奨の印も版で変わる）。
      # 書いてあるのは **moonc の版**（`moon version --all` の 2 行目）で、
      # 配布物の名前になっているのはこちら。moon 側の日付では引けない。
      # 上げるときは手元も一緒に上げて、整形し直したものを同じ commit で出す
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.6+80dc50f24
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version

      # 入れたてのランナーには mooncakes の索引が無い。無いまま解決に入ると
      # 「module was not found in the registry」で止まる（moon install は
      # moon build が勝手にやるが、索引の取得だけはやらない）
      - name: Update the mooncakes index
        run: moon update

      # ここから下は **core を作り直している間だけの姿**。
      #
      # 旧 core を消したので、UI（src/）は繋ぎ先を失っていて組み上がらない。
      # 落ちると分かっているものを回しても信号にならないので、いまは
      # MoonBit だけを見る。すべてが揃うまで結合は行わない。
      #
      # **main へ戻す前に、型検査・UI テスト・vite build・dist の受け渡しを
      # ここへ戻すこと。** deploy ジョブは dist を待っているので、
      # 戻し忘れると main の配布が止まる。
      - name: Check（MoonBit）
        run: cd core && moon check && moon fmt --check tree
      - name: Core tests（MoonBit）
        run: cd core && moon test -p mmm-app/core/tree

      # ラボ（core を覗く画面）だけは TS も見る。core を組んでからでないと
      # 取り込み先が無いので、この順でなければならない
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check（ラボの TypeScript）
        run: pnpm run core && pnpm run check:lab

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 確かめたものを降ろすだけ。ここでは組み直さない
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
