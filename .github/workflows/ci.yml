# 押されたものを確かめ、main のものだけを配る。
#
# **1 つのファイルにまとめてある。** ワークフローをまたぐと順番を約束できず
# （`needs` は同じファイルの中だけ）、確かめ終わる前に配り始めてしまう。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチで重なったら古いほうは捨てる。走り終えた順に上書きされて、
# 新しいはずが古い中身になるのを避ける
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # MoonBit は公式の GitHub Action が無いので、配布スクリプトで入れる。
      # 置き場所は $HOME/.moon/bin で、PATH に通すのはこちらの仕事。
      #
      # **最新を追う。** `latest` と書いてあるのは既定と同じだが、選んだ結果で
      # あって書き忘れではないことを残すため。版を固定すると「動いていた頃」を
      # 抱え、上げる引き金を人が覚えていなければならない。常に今の処理系に
      # 合わせ、赤くなったら直す（#24。上流の repo も全部この向き）。
      #
      # 赤くなる形は 2 つ。**整形の出す形が変わって `moon fmt --check` が
      # 落ちる**か、**非推奨の印が増える**か。どちらも手元を `latest` に上げ、
      # 直したものを同じ commit で出す。下の `moon version --all` が、その回に
      # 何が入ったかを言う（効くのは 2 行目の moonc）
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all

      # 入れたてのランナーには mooncakes の索引が無い。無いまま解決に入ると
      # 「module was not found in the registry」で止まる（moon install は
      # moon build が勝手にやるが、索引の取得だけはやらない）
      - name: Update the mooncakes index
        run: moon update

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check（MoonBit）
        run: pnpm run check:core
      - name: Core tests（MoonBit）
        run: pnpm run test:core

      # コアの JS はここで作る。型検査もテストもこれが無いと始まらない
      - run: pnpm run core

      - name: Type check（src・test・lab）
        run: pnpm run check
      - name: UI tests（TypeScript）
        run: pnpm test

      # 配信されるものが実際に組み上がることまで見る
      - name: Build
        run: pnpm exec vite build

      # 配る中身をそのまま渡す。deploy 側で組み直すと、
      # 確かめたものと配るものが別々になりうる
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 確かめたものを降ろすだけ。ここでは組み直さない
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
