<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mmm</title>
    <!-- favicon は theme.ts がブランドカラー付きで差し込む（形の源は logo.ts） -->
    <!-- CSS は head で読む。JS 経由の注入だと当たるまでの一瞬 unstyled が
         見える（dev で顕著）。vite が dev では render-blocking で配り、
         build ではハッシュ付きに差し替える。 -->
    <!-- コードの字。**外へ 1 本だけ通信する**（swap なので、届くまでは
         下の stack で読める。オフラインでもそのまま動く） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- 中身（m のパス）は theme.ts が logo.ts から注入する -->
        <svg id="logo" width="22" height="22" viewBox="0 0 144 144" role="button" tabindex="0" aria-label="Change brand color">
          <title>Change brand color</title>
        </svg>
        <span id="filename">empty.md</span>
        <span id="dirty" hidden>●</span>
        <span class="spacer"></span>
        <!-- 道具はまとめて右へ。左は「いま何を開いているか」だけにする。
             Files と ⋯ は枠を持たない字（ネイティブのメニューバーと
             同じ佇まい）で、押すと下に開く -->
        <button id="btn-file" class="menu-name">Files</button>
        <!-- 書き出しだけは 1 つの操作の 2 面（出し方 / 選び直し）なので、
             枠を重ねて塊に見せる。中身の絵と文字は src/icons.ts から入れる -->
        <span class="group">
          <button id="btn-export"></button>
          <button id="btn-export-way" title="Choose how to export"></button>
        </span>
        <button id="btn-more" class="menu-name" title="More">⋯</button>
      </header>
      <main id="panes">
        <section id="md-pane"></section>
        <div id="splitter"></div>
        <section id="map-pane" tabindex="0"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
