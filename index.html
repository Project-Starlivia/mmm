<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mmm</title>
    <!-- favicon は theme.ts がブランドカラー付きで差し込む（形の源は logo.ts） -->
    <!-- CSS は head で読む。JS 経由の注入だと当たるまでの一瞬 unstyled が
         見える（dev で顕著）。vite が dev では render-blocking で配り、
         build ではハッシュ付きに差し替える。 -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- 中身（m のパス）は theme.ts が logo.ts から注入する -->
        <svg id="logo" width="22" height="22" viewBox="0 0 144 144" role="button" tabindex="0" aria-label="Change brand color">
          <title>Change brand color</title>
        </svg>
        <span id="filename">empty.md</span>
        <span id="dirty" hidden>●</span>
        <span class="spacer"></span>
        <button id="btn-new" title="New (Mod+Alt+N)">New</button>
        <button id="btn-open" title="Open (Mod+O)">Open</button>
        <button id="btn-save" title="Save (Mod+S)">Save</button>
        <span class="sep"></span>
        <button id="btn-undo" title="Undo (Mod+Z)" disabled>↩</button>
        <button id="btn-redo" title="Redo (Mod+Shift+Z)" disabled>↪</button>
        <span class="sep"></span>
        <button id="btn-export">SVG</button>
        <button id="btn-export-way" title="Choose how to export">▾</button>
        <span class="sep"></span>
        <button id="btn-view-md" class="toggle" title="Toggle the Markdown pane">MD</button>
        <button id="btn-view-map" class="toggle" title="Toggle the map pane">Map</button>
        <span class="sep"></span>
        <button id="btn-theme" title="Toggle theme">◑</button>
      </header>
      <main id="panes">
        <section id="md-pane"></section>
        <div id="splitter"></div>
        <section id="map-pane" tabindex="0"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
