<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mmm</title>
    <!-- favicon は theme.ts が差し込む（形は logo.ts、色は --accent が源） -->
    <!-- CSS は head で読む。JS 経由の注入だと当たるまでの一瞬 unstyled が
         見える（dev で顕著）。vite が dev では render-blocking で配り、
         build ではハッシュ付きに差し替える。 -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <!-- 中身（m のパス）は theme.ts が logo.ts から注入する -->
        <svg id="logo" width="22" height="22" viewBox="0 0 144 144" aria-label="mmm">
          <title>mmm</title>
        </svg>
        <span id="filename">empty.md</span>
        <span id="dirty" hidden>●</span>
        <span class="spacer"></span>
        <button id="btn-new" title="新規 (Mod+Alt+N)">新規</button>
        <button id="btn-open" title="開く (Mod+O)">開く</button>
        <button id="btn-save" title="保存 (Mod+S)">保存</button>
        <span class="sep"></span>
        <button id="btn-undo" title="元に戻す (Mod+Z)" disabled>↩</button>
        <button id="btn-redo" title="やり直す (Mod+Shift+Z)" disabled>↪</button>
        <span class="sep"></span>
        <button id="btn-export-svg" title="マップを SVG でダウンロード">SVG</button>
        <span class="sep"></span>
        <button id="btn-view-md" class="toggle" title="MD ペインの表示/非表示">MD</button>
        <button id="btn-view-map" class="toggle" title="マップペインの表示/非表示">マップ</button>
        <span class="sep"></span>
        <button id="btn-theme" title="テーマ切り替え">◑</button>
      </header>
      <main id="panes">
        <section id="md-pane"></section>
        <div id="splitter"></div>
        <section id="map-pane" tabindex="0"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
